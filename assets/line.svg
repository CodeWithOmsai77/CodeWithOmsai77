<svg width="900" height="36" viewBox="0 0 900 36"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main RTL glow -->
    <filter id="rtlGlow"
            x="-50%" y="-100%"
            width="200%" height="300%">

      <feGaussianBlur stdDeviation="2.5" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Stronger signal glow -->
    <filter id="signalGlow"
            x="-50%" y="-100%"
            width="200%" height="300%">

      <feGaussianBlur stdDeviation="1.8" result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Silicon gradient -->
    <linearGradient id="silicon"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%" stop-color="#12343d"/>
      <stop offset="50%" stop-color="#00F7FF"/>
      <stop offset="100%" stop-color="#12343d"/>

    </linearGradient>

  </defs>


  <!-- ================================================= -->
  <!-- BASE PCB / SIGNAL TRACE -->
  <!-- ================================================= -->

  <line
    x1="0"
    y1="18"
    x2="900"
    y2="18"
    stroke="#12333b"
    stroke-width="1.5"/>


  <!-- ================================================= -->
  <!-- LEFT RTL LABEL -->
  <!-- ================================================= -->

  <text
    x="18"
    y="22"
    font-family="Fira Code, monospace"
    font-size="10"
    font-weight="bold"
    fill="#4d8b96">

    RTL

  </text>


  <!-- ================================================= -->
  <!-- CLOCK SIGNAL -->
  <!-- ================================================= -->

  <path
    d="M55 18
       H70
       V8
       H80
       V18
       H90
       V8
       H100
       V18
       H110
       V8
       H120
       V18"

    fill="none"
    stroke="#00F7FF"
    stroke-width="1.4"
    opacity="0.65"/>


  <!-- moving clock highlight -->

  <circle
    cy="18"
    r="3"
    fill="#ffffff"
    filter="url(#signalGlow)">

    <animate
      attributeName="cx"
      values="55;120;55"
      dur="2.2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- LOGIC GATE SECTION -->
  <!-- ================================================= -->

  <!-- input wires -->

  <path
    d="M135 10 H160
       M135 26 H160"

    stroke="#28717e"
    stroke-width="1.2"
    fill="none"/>


  <!-- AND gate -->

  <path
    d="M160 7
       H175
       A11 11 0 0 1 175 29
       H160
       Z"

    fill="#0b2027"
    stroke="#00F7FF"
    stroke-width="1.2"/>


  <!-- AND output -->

  <path
    d="M186 18 H215"

    stroke="#28717e"
    stroke-width="1.2"
    fill="none"/>


  <!-- signal travelling through gate -->

  <circle
    cy="18"
    r="2.5"
    fill="#00F7FF"
    filter="url(#signalGlow)">

    <animate
      attributeName="cx"
      values="135;215;135"
      dur="2.8s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- MUX SYMBOL -->
  <!-- ================================================= -->

  <path
    d="M230 7
       L260 11
       V25
       L230 29
       Z"

    fill="#0b2027"
    stroke="#00F7FF"
    stroke-width="1.2"/>


  <!-- MUX input lines -->

  <path
    d="M215 10 H230
       M215 26 H230"

    stroke="#28717e"
    stroke-width="1.2"
    fill="none"/>


  <!-- MUX select -->

  <path
    d="M245 30 V34"

    stroke="#28717e"
    stroke-width="1.2"/>


  <!-- MUX output -->

  <path
    d="M260 18 H290"

    stroke="#28717e"
    stroke-width="1.2"
    fill="none"/>


  <!-- moving signal -->

  <circle
    cy="18"
    r="2.5"
    fill="#ffffff"
    filter="url(#signalGlow)">

    <animate
      attributeName="cx"
      values="215;290;215"
      dur="2.4s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- REGISTER / FLIP-FLOP -->
  <!-- ================================================= -->

  <rect
    x="305"
    y="7"
    width="50"
    height="22"
    rx="2"
    fill="#0b2027"
    stroke="#00F7FF"
    stroke-width="1.2"/>


  <!-- D -->

  <text
    x="313"
    y="21"
    font-family="Fira Code, monospace"
    font-size="9"
    fill="#6fd6e0">

    D

  </text>


  <!-- Q -->

  <text
    x="344"
    y="21"
    font-family="Fira Code, monospace"
    font-size="9"
    fill="#6fd6e0">

    Q

  </text>


  <!-- clock -->

  <path
    d="M330 29 V34"

    stroke="#00F7FF"
    stroke-width="1"/>


  <!-- Register input -->

  <path
    d="M290 18 H305"

    stroke="#28717e"
    stroke-width="1.2"/>


  <!-- Register output -->

  <path
    d="M355 18 H385"

    stroke="#28717e"
    stroke-width="1.2"/>


  <!-- ================================================= -->
  <!-- NETLIST / INTERCONNECT -->
  <!-- ================================================= -->

  <path
    d="M385 18
       H405
       V8
       H430
       V28
       H455
       V18
       H475"

    fill="none"
    stroke="#28717e"
    stroke-width="1.2"/>


  <!-- Junction nodes -->

  <g fill="#00F7FF">

    <circle cx="405" cy="18" r="2"/>
    <circle cx="430" cy="8" r="2"/>
    <circle cx="430" cy="28" r="2"/>
    <circle cx="455" cy="18" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- SILICON / STANDARD CELL REGION -->
  <!-- ================================================= -->

  <rect
    x="495"
    y="5"
    width="120"
    height="26"
    rx="3"
    fill="#07171c"
    stroke="#18505d"
    stroke-width="1"/>


  <!-- internal cell grid -->

  <g
    stroke="#1b6472"
    stroke-width="0.7"
    opacity="0.75">

    <line x1="505" y1="12" x2="605" y2="12"/>
    <line x1="505" y1="18" x2="605" y2="18"/>
    <line x1="505" y1="24" x2="605" y2="24"/>

    <line x1="515" y1="7" x2="515" y2="29"/>
    <line x1="530" y1="7" x2="530" y2="29"/>
    <line x1="545" y1="7" x2="545" y2="29"/>
    <line x1="560" y1="7" x2="560" y2="29"/>
    <line x1="575" y1="7" x2="575" y2="29"/>
    <line x1="590" y1="7" x2="590" y2="29"/>

  </g>


  <!-- transistor activity -->

  <g fill="#00F7FF" filter="url(#signalGlow)">

    <circle cx="515" cy="12" r="1.5">
      <animate
        attributeName="opacity"
        values="0.15;1;0.15"
        dur="1.2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="545" cy="24" r="1.5">
      <animate
        attributeName="opacity"
        values="0.1;1;0.1"
        dur="1.6s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="575" cy="12" r="1.5">
      <animate
        attributeName="opacity"
        values="0.15;1;0.15"
        dur="1.4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="590" cy="24" r="1.5">
      <animate
        attributeName="opacity"
        values="0.1;1;0.1"
        dur="1.8s"
        repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================================================= -->
  <!-- DATA BUS EXIT -->
  <!-- ================================================= -->

  <path
    d="M615 18 H665"

    stroke="#28717e"
    stroke-width="1.2"
    fill="none"/>


  <!-- moving data packet -->

  <circle
    cy="18"
    r="3"
    fill="url(#silicon)"
    filter="url(#rtlGlow)">

    <animate
      attributeName="cx"
      values="495;665;495"
      dur="3.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ================================================= -->
  <!-- GDSII STYLE ROUTING -->
  <!-- ================================================= -->

  <path
    d="M665 18
       H690
       V8
       H720
       V28
       H750
       V18
       H775"

    fill="none"
    stroke="#8a6a1e"
    stroke-width="1.1"/>


  <!-- routing vias -->

  <g
    fill="#d4af37"
    filter="url(#signalGlow)">

    <circle cx="690" cy="18" r="2"/>
    <circle cx="720" cy="8" r="2"/>
    <circle cx="720" cy="28" r="2"/>
    <circle cx="750" cy="18" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- SILICON OUTPUT -->
  <!-- ================================================= -->

  <path
    d="M775 18 H810"

    stroke="#28717e"
    stroke-width="1.2"/>


  <!-- tiny die -->

  <rect
    x="810"
    y="10"
    width="18"
    height="16"
    rx="2"
    fill="#111827"
    stroke="#00F7FF"
    stroke-width="1"/>


  <g fill="#00F7FF">

    <rect x="814" y="13" width="3" height="3"/>
    <rect x="821" y="13" width="3" height="3"/>
    <rect x="814" y="20" width="3" height="3"/>
    <rect x="821" y="20" width="3" height="3"/>

  </g>


  <!-- ================================================= -->
  <!-- FINAL LABEL -->
  <!-- ================================================= -->

  <text
    x="845"
    y="22"
    font-family="Fira Code, monospace"
    font-size="9"
    fill="#4d8b96">

    ASIC

  </text>


  <!-- ================================================= -->
  <!-- GLOBAL SIGNAL SWEEP -->
  <!-- ================================================= -->

  <rect
    x="-20"
    y="17"
    width="8"
    height="2"
    rx="1"
    fill="#ffffff"
    filter="url(#signalGlow)">

    <animate
      attributeName="x"
      values="-20;880"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

</svg>
